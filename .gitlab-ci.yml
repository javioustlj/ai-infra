# GitLab Pages 部署 —— Hugo + Docsy 静态站点。
#
# 说明：
# - 此 CI 只在 GitLab 上运行；GitHub Pages 仍由 .github/workflows/pages.yaml
#   独立负责（在 ubuntu-latest VM 上跑），两边互不影响。
# - baseURL 在构建时用 GitLab 预定义变量 $CI_PAGES_URL 覆盖，不改 hugo.yaml，
#   因此 GitHub 侧的 baseURL 配置保持原样。
# - Pages 站点：https://ai-infra-71fad6.pages.birentech.com（unique domain，根路径服务）。
#
# 为什么不用 hugomods/hugo:exts：该镜像 exts 标签最高只到 0.154.5，而本站
# (Docsy 主题) 要求 Hugo >= 0.158.0 extended。故用 golang 镜像 + 从 github
# 下载对应版本 hugo extended 二进制来构建。golang 镜像默认 root，apk 不会
# 像 floryn90/hugo 那样 Permission denied。

image: golang:1.23-alpine

variables:
  HUGO_ENVIRONMENT: production
  HUGO_ENV: production
  HUGO_VERSION: "0.161.1"
  # 内网对出站 HTTPS 做自签证书 MITM，git/go 默认校验会失败。
  # 跳过 TLS 校验并走 direct 模式直接从 github 拉取 Hugo Module。
  GOPROXY: direct
  GOINSECURE: "*"
  GONOSUMDB: "*"
  GIT_SSL_NO_VERIFY: "1"

pages:
  stage: deploy
  tags:
    # 实例的 Pages 构建专用 runner 注册了 common-pages 标签，必须指定才会被调度。
    - common-pages
  script:
    - apk add --no-cache git
    - git config --global http.sslVerify "false"
    - git config --global --add safe.directory '*'
    # 下载并安装 Hugo extended（与本地/GitHub Actions 侧一致的版本）。
    # 内网对 github 做 MITM 自签证书，wget 也需 --no-check-certificate。
    - |
      wget -q --no-check-certificate -O /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
      tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
      hugo version
    - hugo --gc --minify --baseURL "${CI_PAGES_URL}/"
  artifacts:
    paths:
      - public
  rules:
    # 只在默认分支 (main) 部署，与 GitHub Pages 的触发分支保持一致。
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
