# GitLab Pages 部署 —— Hugo + Docsy 静态站点。
#
# 说明：
# - 此 CI 只在 GitLab 上运行；GitHub Pages 仍由 .github/workflows/pages.yaml
#   独立负责（在 ubuntu-latest VM 上跑），两边互不影响。
# - baseURL 在构建时用 GitLab 预定义变量 $CI_PAGES_URL 覆盖，不改 hugo.yaml，
#   因此 GitHub 侧的 baseURL 配置保持原样。
# - Pages 站点：https://ai-infra-71fad6.pages.birentech.com（unique domain，根路径服务）。
#
# 镜像选择：用 golang:1.23-bookworm（debian/glibc）。
# 不用 alpine：hugo_extended 官方 linux-amd64 二进制按 glibc 编译，在 musl(alpine)
# 上执行会报 "not found"（ld-linux 动态链接器缺失）。
# 不用 hugomods/hugo:exts：其 exts 标签最高 0.154.5，不满足 Docsy 要求的 Hugo>=0.158。

image: golang:1.23-bookworm

variables:
  HUGO_ENVIRONMENT: production
  HUGO_ENV: production
  HUGO_VERSION: "0.161.1"
  # 内网对出站 HTTPS 做自签证书 MITM，git/go 默认校验会失败。
  # 跳过 TLS 校验并走 direct 模式直接从 github 拉取 Hugo Module。
  GOPROXY: direct
  GOINSECURE: "*"
  GONOSUMDB: "*"
  GIT_SSL_NO_VERIFY: "1"

pages:
  stage: deploy
  tags:
    # 实例的 Pages 构建专用 runner 注册了 common-pages 标签，必须指定才会被调度。
    - common-pages
  script:
    - git config --global http.sslVerify "false"
    - git config --global --add safe.directory '*'
    # 下载并安装 Hugo extended（与本地/GitHub Actions 侧一致的版本）。
    # 内网对 github 做 MITM 自签证书，wget 需 --no-check-certificate。
    - |
      wget --no-check-certificate -O /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
      tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
      hugo version
    - hugo --gc --minify --baseURL "${CI_PAGES_URL}/"
  artifacts:
    paths:
      - public
  rules:
    # 只在默认分支 (main) 部署，与 GitHub Pages 的触发分支保持一致。
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
