# GitLab Pages 部署 —— Hugo + Docsy 静态站点。
#
# 说明：
# - 此 CI 只在 GitLab 上运行；GitHub Pages 仍由 .github/workflows/pages.yaml
#   独立负责（在 ubuntu-latest VM 上跑），两边互不影响。
# - baseURL 在构建时用 GitLab 预定义变量 $CI_PAGES_URL 覆盖，不改 hugo.yaml，
#   因此 GitHub 侧的 baseURL 配置保持原样。
# - Pages 站点：https://ai-infra-71fad6.pages.birentech.com（unique domain，根路径服务）。

# hugomods/hugo:exts 自带 Hugo extended + Go + Git + Node + dart-sass + PostCSS，
# Docsy 用 Hugo Module 拉取 github.com/google/docsy/theme 需要 Go，此镜像已含，
# 无需再 apk 安装（common-pages runner 为非 root，apk 安装会 Permission denied）。
image:
  name: hugomods/hugo:exts
  # 清空 entrypoint，避免镜像默认入口吞掉 GitLab 的 `sh -c`。
  entrypoint: [""]

variables:
  HUGO_ENVIRONMENT: production
  HUGO_ENV: production
  # 内网对出站 HTTPS 做自签证书 MITM，git/go 默认校验会失败。
  # 跳过 TLS 校验并走 direct 模式直接从 github 拉取 Hugo Module。
  GOPROXY: direct
  GOINSECURE: "*"
  GONOSUMDB: "*"
  GIT_SSL_NO_VERIFY: "1"

pages:
  stage: deploy
  tags:
    # 实例的 Pages 构建专用 runner 注册了 common-pages 标签，必须指定才会被调度。
    - common-pages
  script:
    - git config --global http.sslVerify "false"
    - git config --global --add safe.directory '*'
    - hugo version
    - hugo --gc --minify --baseURL "${CI_PAGES_URL}/"
  artifacts:
    paths:
      - public
  rules:
    # 只在默认分支 (main) 部署，与 GitHub Pages 的触发分支保持一致。
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
